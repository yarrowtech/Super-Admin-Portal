services:
  - type: web
    name: super-admin-backend
    runtime: node
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: CACHE_ENABLED
        value: "true"
      - key: LOG_LEVEL
        value: info
      - key: MONGO_URI
        sync: false
      - key: CORS_ORIGIN
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: EFNBMMS_ADMIN_MANAGEMENT_API_URL
        sync: false
      - key: EFNBMMS_API_TOKEN
        sync: false
      - key: EDIFYEIGHT_API_URL
        sync: false
      - key: EDIFYEIGHT_TEACHER_API_URL
        sync: false
      - key: EDIFYEIGHT_STUDY_MATERIAL_API_URL
        sync: false
      - key: EDIFYEIGHT_API_TOKEN
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
